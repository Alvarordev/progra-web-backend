services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copia env.local a .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copia env.local a .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia env.local a .env}
    ports:
      - "127.0.0.1:${DB_PORT:?Copia env.local a .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15

  correo:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
